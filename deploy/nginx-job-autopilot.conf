# nginx -> Job Autopilot (Next.js on 127.0.0.1:3000)
#
# Install with deploy/nginx-setup.sh, which symlinks this into sites-enabled,
# tests the config and reloads.

server {
    # IPv4 only: "listen [::]:80" is a hard config error on a host without
    # IPv6, and an EC2 public IP is v4 anyway. nginx-setup.sh removes the stock
    # default site, which makes this block the one that answers port 80.
    listen 80;
    server_name _;

    # Resume uploads. nginx defaults to 1 MB and returns 413 before the app
    # ever sees the request; the app itself accepts up to 10 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Host must be passed through unchanged. The app builds its post-login
        # redirect from it, and Next compares Origin against it for the CSRF
        # check on every Server Action — the whole setup wizard is Server
        # Actions, so a rewritten Host breaks the app in a confusing way.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Parsing a resume or tailoring one is a single model call that can run
        # well past nginx's 60s default, which would show up as a 504 halfway
        # through setup.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
    }
}
